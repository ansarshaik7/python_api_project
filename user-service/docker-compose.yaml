version: '3'
services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:pythonapi123@db:5432/userdb
    depends_on:
      - db
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pythonapi123
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"